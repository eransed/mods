# Run rustfmt with this config (it should be picked up automatically).
style_edition = "2024"
use_small_heuristics = "Max"
merge_derives = false
use_field_init_shorthand = true
max_width = 100
tab_spaces = 2

# Files to ignore. Each entry uses gitignore syntax, but `!` prefixes aren't allowed.
# ignore = [
#     "ui/",
#     "logs/",
#     "target/",
# ]
